<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AOB to C++</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Orbitron', sans-serif;
        background: linear-gradient(135deg, #0d1b2a, #1b263b);
        color: #ff0000;
        overflow: hidden;
        position: relative;
    }

    #particles-js {
        position: fixed;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    .card {
        position: relative;
        z-index: 2;
        max-width: 500px;
        margin: 100px auto;
        background: rgba(0, 10, 30, 0.7);
        border: 2px solid #ff0000;
        height: 700px;
        border-radius: 25px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 0 35px #ff0000;
        backdrop-filter: blur(12px);
        transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    @keyframes glowPulse {
        0%, 100% { box-shadow: 0 0 35px #ff0000; }
        50% { box-shadow: 0 0 60px #ff0000; }
    }

    .card:hover {
        animation: glowPulse 1.5s ease-in-out infinite;
        transform: translateY(-5px) translateX(5px);
    }

    .card h1 {
        font-size: 40px;
        margin-bottom: 30px;
        text-shadow: 0 0 12px #ff0000;
    }

    .card input {
        width: 100%;
        padding: 16px;
        border: 4px solid #ff0000;
        border-radius: 10px;
        background: #000;
        color: #ff0000;
        font-size: 18px;
        margin-bottom: 25px;
        box-shadow: 0 0 10px #ff0000;
    }

    .byte-count {
        font-size: 22px;
        color: #ff0000;
        text-shadow: 0 0 6px #ff0000;
        margin-bottom: 25px;
    }

    pre {
        padding: 16px;
        border: 4px solid #ff0000;
        border-radius: 10px;
        background: #000;
        color: #ff0000;
        font-size: 18px;
        overflow-x: auto;
        word-break: break-word;
        white-space: pre-wrap;
        box-shadow: 0 0 12px #ff0000;
    }

    

    .discord-icon {
        position: fixed;
        top: 25px;
        right: 25px;
        z-index: 3;
        width: 60px;
        height: 60px;
        background: radial-gradient(circle at 30% 30%, #7289da, #4e5d94);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px #7289da, 0 0 40px #7289da;
        transition: transform 0.3s ease;
    }

    .discord-icon:hover {
        transform: scale(1.1) rotate(5deg);
        box-shadow: 0 0 25px #7289da, 0 0 50px #7289da;
    }

    .discord-icon img {
        width: 32px;
        height: 32px;
    }

    .footer {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        font-size: 18px;
        color: #ff0000;
        text-shadow: 0 0 10px #fd0000;
        font-weight: bold;
    }
    .copy-btn {
            background: linear-gradient(145deg, #850900, #ff0000);
            color: white;
            border: 1px solid #ff0000;
            border-radius: 8px;
            position: relative;
            top: 1vw;
            padding: 20px 39px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 16 px;
            cursor: pointer;
            margin-bottom: 15px;
            margin-right: 15px;
            box-shadow: 
                0 4px 8px rgba(255, 0, 0, 0.6),
                0 2px 4px rgba(255, 11, 11, 0.8),
                inset 0 1px 2px rgba(255, 0, 0, 0.1);
            transition: all 0.3s ease;
            transform: translateZ(10px);
        }

        .copy-btn:hover {
            background: linear-gradient(145deg, #ff0000, #850900);
            box-shadow: 
                0 6px 12px rgba(255, 0, 0, 0.8),
                0 3px 6px rgba(255, 0, 0, 0.9),
                inset 0 1px 2px rgb(255, 1, 1);
            transform: translateZ(8px) translateY(-2px);
        }

        .copy-btn:active {
            transform: translateZ(2px) translateY(1px);
            box-shadow: 
                0 2px 4px rgba(255, 0, 0, 0.8),
                0 1px 2px rgba(255, 0, 0, 0.9);
        }
        .confirmation-message{
          position: relative;
          top: 10vw;
        }
</style>

</head>
<body>
  <div id="particles-js"></div>

  <a href="https://discord.gg/D6CVhjcmxN" target="_blank" class="discord-icon" title="Join Discord">
    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" alt="Discord" />
  </a>

  <div class="card"><br><br>
    <h1>AOB TO C++</h1>
    <input id="aobInput" type="text" placeholder="Paste AOB like: A1 B2 00 4F ?? 1C ..." />
    <div class="byte-count" id="byteCount">BYTE COUNT: 0</div>
    <pre id="cppOutput">BYTE COUNT OUTPUT HERE !</pre>
    <button class="copy-btn" onclick="copyOutput()">COPY</button> <!-- Add COPY button -->
    <div class="confirmation-message" id="confirmationMessage">Copied to clipboard!</div> <!-- Confirmation message -->
  </div>

  <div class="footer">Developed by SULTAN CHEAT</div>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
      particlesJS("particles-js", {
          "particles": {
              "number": { "value": 80 },
              "color": { "value": "#ff0000" }, // Particle color
              "shape": { "type": "circle" },
              "opacity": { "value": 0.5 },
              "size": { "value": 3 },
              "line_linked": {
                  "enable": true,
                  "distance": 150,
                  "color": "#ff0000", // Line color
                  "opacity": 0.4,
                  "width": 1
              },
              "move": { "enable": true, "speed": 2 }
          }
      });

      const aobInput = document.getElementById("aobInput");
      const cppOutput = document.getElementById("cppOutput");
      const byteCount = document.getElementById("byteCount");
      const confirmationMessage = document.getElementById("confirmationMessage");

      aobInput.addEventListener("input", () => {
          const parts = aobInput.value.trim().split(/\s+/);
          let bytes = [];
          let count = 0;

          for (let part of parts) {
              if (part === "??") {
                  bytes.push("/* ? */");
              } else if (/^[A-Fa-f0-9]{2}$/.test(part)) {
                  bytes.push("0x" + part.toUpperCase());
                  count++;
              }
          }

          byteCount.textContent = `BYTE COUNT: ${count}`;
          cppOutput.textContent = `${bytes.join(", ")}`; // Update cppOutput with the joined bytes
      });

      function copyOutput() {
          const cppOutputText = document.getElementById("cppOutput").textContent; // Get the text content of cppOutput
          navigator.clipboard.writeText(cppOutputText).then(() => {
              confirmationMessage.style.display = "block"; // Show confirmation message
              setTimeout(() => {
                  confirmationMessage.style.display = "none"; // Hide after 2 seconds
              }, 2000);
          }).catch(err => {
              console.error("Failed to copy: ", err); // Handle errors
          });
      }
  </script>
</body>
</html>
